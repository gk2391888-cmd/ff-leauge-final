<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FF LEAGUE - PRO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#080808;color:white}
.header{background:#111;padding:15px;text-align:center;border-bottom:2px solid #ff0040}
.card{background:#1a1a1a;margin:12px;border-radius:14px;padding:18px;border:1px solid #222}
input,select{width:100%;padding:13px;margin:7px 0;border-radius:9px;border:none;background:#222;color:white;font-size:14px}
.pay-btn{width:100%;padding:14px;background:linear-gradient(90deg,#ff0040,#ff6a00);color:white;border:none;border-radius:10px;font-weight:bold;font-size:16px;cursor:pointer}
.qr{background:white;padding:12px;border-radius:12px;text-align:center;margin:10px 0}
.qr img{width:180px}
.tag{padding:4px 10px;border-radius:20px;font-size:11px;margin:2px;display:inline-block;border:1px solid}
</style>
</head>
<body>
<div class="header"><h2>🔥 FF LEAGUE - OFFICIAL</h2><p style="font-size:12px;color:#aaa">PRO TOURNAMENT SYSTEM</p></div>

<div class="card" style="text-align:center">
<h3>🏆 DAILY WINNINGS</h3>
<span class="tag" style="color:#ff0040;border-color:#ff0040">SOLO ₹10 → WIN ₹100</span>
<span class="tag" style="color:#00ff88;border-color:#00ff88">DUO ₹20 → WIN ₹200</span>
<span class="tag" style="color:#0088ff;border-color:#0088ff">SQUAD ₹40 → WIN ₹400</span>
</div>

<div class="card">
<h3>💳 PAY & JOIN - AUTO WALLET</h3>
<div class="qr">
<p style="color:black;font-weight:bold;font-size:13px" id="qrText">Scan & Pay ₹10 For SOLO</p>
<img id="qrImg" src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=upi://pay?pa=gk2391888@oksbi&pn=FFLEAGUE&am=10&cu=INR">
<p style="color:black;font-size:11px;margin-top:5px">UPI: gk2391888@oksbi</p>
</div>

<form id="ffForm">
<input type="text" name="ffid" placeholder="FF UID (8-12 digit)" required>
<input type="text" name="idname" placeholder="In-Game Name (e.g. Toxic_Boy)" required>
<select name="match" id="matchType" required onchange="updateQR()">
<option value="">Match Type Select Karo</option>
<option value="SOLO - ₹10">SOLO - ₹10</option>
<option value="DUO - ₹20">DUO - ₹20</option>
<option value="SQUAD - ₹40">SQUAD - ₹40</option>
</select>
<input type="text" name="utr" placeholder="UTR / Transaction ID (Pay ke baad milta hai)" required>
<button type="submit" id="btn" class="pay-btn">✅ JOIN TOURNAMENT</button>
<p id="msg" style="text-align:center;margin-top:10px;font-size:13px"></p>
</form>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyNy1vDbj9OLX3xitrV-z8SFJZLtCRnvY-LaldPuKrBeW2TtBavdhki8oIgHBYR9MpaQ/exec';

function updateQR(){
 let v = document.getElementById('matchType').value;
 let img = document.getElementById('qrImg');
 let txt = document.getElementById('qrText');
 if(v.includes('10')){img.src='https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=upi://pay?pa=gk2391888@oksbi&pn=FFLEAGUE&am=10&cu=INR'; txt.innerText='Scan & Pay ₹10 For SOLO';}
 if(v.includes('20')){img.src='https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=upi://pay?pa=gk2391888@oksbi&pn=FFLEAGUE&am=20&cu=INR'; txt.innerText='Scan & Pay ₹20 For DUO';}
 if(v.includes('40')){img.src='https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=upi://pay?pa=gk2391888@oksbi&pn=FFLEAGUE&am=40&cu=INR'; txt.innerText='Scan & Pay ₹40 For SQUAD';}
}

document.getElementById('ffForm').addEventListener('submit', async (e)=>{
 e.preventDefault();
 let btn = document.getElementById('btn');
 let msg = document.getElementById('msg');
 btn.innerText='⏳ JOINING...'; btn.disabled=true;
 msg.style.color='#ffaa00'; msg.innerText='Verifying... Wallet ban raha hai...';
 
 let form = new FormData(e.target);
 form.append('action','join');

 try{
  await fetch(SCRIPT_URL,{method:'POST',body:form});
  msg.style.color='#00ff88';
  msg.innerHTML='✅ JOIN SUCCESS!<br><small>Wallet me ₹0 added. Winning amount admin add karega!</small>';
  btn.innerText='✅ JOINED';
  alert('✅ SUCCESS!\n\nFF ID: '+form.get('ffid')+'\nName: '+form.get('idname')+'\n\nAdmin panel me ab dikhega!\nRoom ID WhatsApp pe ayega!');
  e.target.reset();
 }catch(err){
  msg.style.color='#ff0040'; msg.innerText='❌ Error! Net check karo';
 }
 btn.innerText='✅ JOIN TOURNAMENT'; btn.disabled=false;
});
</script>
</body>
</html>
