<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FF LEAGUE PRO ADMIN</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#080808;color:white;padding:10px}
.header{background:#111;padding:15px;border-radius:12px;text-align:center;border:1px solid #ff004022}
.stats{display:flex;gap:10px;margin:15px 0;overflow-x:auto}
.stat{background:#1a1a1a;flex:1;min-width:110px;padding:15px;border-radius:12px;text-align:center;border-bottom:3px solid #ff0040}
.stat h2{font-size:24px;color:#ff0040}
.stat p{font-size:12px;color:#aaa}
.card{background:#1a1a1a;padding:15px;border-radius:12px;margin:10px 0}
input{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:none;background:#222;color:white}
.btn{padding:10px 14px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin:2px}
.btn-red{background:#ff0040;color:white}
.btn-green{background:#00ff88;color:black}
.btn-blue{background:#0088ff;color:white}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px;border-bottom:1px solid #222;text-align:left}
th{color:#ff0040;position:sticky;top:0;background:#1a1a1a}
.action-btn{padding:5px 8px;font-size:11px;border-radius:5px;border:none;cursor:pointer;margin:1px}
</style>
</head>
<body>
<div id="login" style="text-align:center;margin-top:80px">
<h1>🔒 FF LEAGUE</h1><h3>PRO ADMIN PANEL</h3><br>
<input type="password" id="pass" placeholder="Password" style="max-width:300px"><br><br>
<button class="btn btn-red" onclick="login()">LOGIN</button>
<p style="color:gray;font-size:12px;margin-top:10px">Pass: FFADMIN123</p>
</div>

<div id="main" style="display:none">
<div class="header"><h2>🔥 FF LEAGUE - PRO CONTROL</h2><p id="liveTime"></p></div>

<div class="stats">
<div class="stat"><h2 id="totalUsers">0</h2><p>TOTAL USERS</p></div>
<div class="stat" style="border-color:#00ff88"><h2 id="totalBal">₹0</h2><p>WALLET BALANCE</p></div>
<div class="stat" style="border-color:#0088ff"><h2 id="totalActive">0</h2><p>ACTIVE</p></div>
</div>

<div class="card">
<h3>💰 WALLET CONTROL</h3>
<input type="text" id="searchFFID" placeholder="FF ID Daalo (e.g. 2123456789)">
<div style="display:flex;gap:5px">
<input type="number" id="amount" placeholder="Amount ₹">
<button class="btn btn-green" onclick="updateBal(1)">+ ADD</button>
<button class="btn btn-red" onclick="updateBal(-1)">- CUT</button>
</div>
<p id="balMsg" style="font-size:12px;margin-top:5px"></p>
</div>

<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center">
<h3>👥 ALL PLAYERS LIVE</h3>
<button class="btn btn-blue" onclick="loadData()">🔄 REFRESH</button>
</div>
<input type="text" id="search" placeholder="🔍 Search ID Name / FF ID..." onkeyup="filterTable()">
<div style="overflow:auto;max-height:60vh;margin-top:10px">
<table>
<thead><tr><th>FF ID</th><th>ID NAME</th><th>MATCH</th><th>BAL</th><th>UTR</th><th>ACTION</th></tr></thead>
<tbody id="userTable"><tr><td colspan="6" style="text-align:center;color:gray">Loading...</td></tr></tbody>
</table>
</div>
</div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyNy1vDbj9OLX3xitrV-z8SFJZLtCRnvY-LaldPuKrBeW2TtBavdhki8oIgHBYR9MpaQ/exec';
let allUsers = [];

function login(){
 if(document.getElementById('pass').value=='FFADMIN123'){
  document.getElementById('login').style.display='none';
  document.getElementById('main').style.display='block';
  loadData();
  setInterval(loadData, 10000);
 } else alert('Wrong Password');
 setInterval(()=>{document.getElementById('liveTime').innerText=new Date().toLocaleString()},1000);
}

async function loadData(){
 try{
  let res = await fetch(SCRIPT_URL);
  allUsers = await res.json();
  renderTable(allUsers);
  document.getElementById('totalUsers').innerText = allUsers.length;
  document.getElementById('totalActive').innerText = allUsers.filter(u=>u.status=='ACTIVE').length;
  let total = allUsers.reduce((s,u)=>s+ (parseFloat(u.balance)||0),0);
  document.getElementById('totalBal').innerText = '₹'+total;
 }catch(e){console.log(e)}
}

function renderTable(users){
 let html = '';
 users.slice().reverse().forEach(u=>{
  html+=`<tr>
   <td><b>${u.ffid}</b><br><small style="color:gray">${new Date(u.time).toLocaleDateString()}</small></td>
   <td>${u.idname}</td>
   <td><span style="background:#ff004022;color:#ff0040;padding:3px 6px;border-radius:10px;font-size:10px">${u.match}</span></td>
   <td style="color:#00ff88;font-weight:bold">₹${u.balance||0}</td>
   <td><small>${(u.utr||'').substring(0,8)}..</small></td>
   <td>
    <button class="action-btn" style="background:#00ff88" onclick="quickAdd('${u.ffid}',10)">+10</button>
    <button class="action-btn" style="background:#ffaa00" onclick="quickAdd('${u.ffid}',-10)">-10</button>
    <button class="action-btn" style="background:#0088ff;color:white" onclick="copyID('${u.ffid}')">COPY</button>
   </td>
  </tr>`;
 });
 document.getElementById('userTable').innerHTML = html || '<tr><td colspan="6">No users</td></tr>';
}

function filterTable(){
 let q = document.getElementById('search').value.toLowerCase();
 let filtered = allUsers.filter(u=> (u.ffid+'').toLowerCase().includes(q) || (u.idname+'').toLowerCase().includes(q));
 renderTable(filtered);
}

async function updateBal(type){
 let ffid = document.getElementById('searchFFID').value;
 let amt = parseFloat(document.getElementById('amount').value);
 if(!ffid ||!amt) return alert('FF ID aur Amount daalo');
 amt = amt * type;
 document.getElementById('balMsg').innerText = 'Updating...';
 let form = new FormData();
 form.append('action','updateBalance'); form.append('ffid',ffid); form.append('amount',amt);
 await fetch(SCRIPT_URL,{method:'POST',body:form});
 document.getElementById('balMsg').innerText = `✅ ${ffid} ka balance ${amt>0?'+':''}${amt} kar diya!`;
 loadData();
}

function quickAdd(ffid, amt){
 document.getElementById('searchFFID').value = ffid;
 document.getElementById('amount').value = Math.abs(amt);
 updateBal(amt>0?1:-1);
}
function copyID(id){navigator.clipboard.writeText(id);alert('Copied: '+id)}
</script>
</body>
</html>
